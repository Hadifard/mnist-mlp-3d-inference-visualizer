<!--
  Excerpt from the application source (Index.html).
  Author: Hadi Sarhangi Fard

  Shown here: the right sidebar (drawing grid and confidence chart) and the
  training timeline. The 3D scene itself is a <canvas> that Three.js appends to <body>.
-->

<!-- Right sidebar: drawing grid + prediction chart -->
<div class="right-sidebar">
  <div class="grid-section">
    <h3 class="grid-section-title">Draw here</h3>
    <div class="section-subtitle">Right Click = Erase</div>

    <!-- 28 x 28 cells are created here by the sketch pad -->
    <div id="gridContainer" class="grid-container"></div>
    <div id="resetButtonContainer" class="reset-button-container">
      <button id="resetBtn" class="reset-button">RESET</button>
    </div>
  </div>

  <div class="prediction-section">
    <h3 class="prediction-section-title">Confidence</h3>
    <!-- ten bars, one per digit -->
    <div id="predictionChart" class="prediction-chart"></div>
  </div>
</div>

<!-- Timeline overlay (bottom centre): moves through the saved training snapshots -->
<div id="timelineOverlay" class="timeline-overlay hidden">
  <div class="timeline-container">
    <div class="timeline-header">
      <span class="timeline-title">Training Progress</span>
      <span id="timelineSummary" class="timeline-summary"></span>
    </div>
    <input id="timelineSlider" class="timeline-slider" type="range"
           min="0" value="0" step="1" disabled aria-label="Training progress">
    <div class="timeline-meta">
      <span id="timelineLabel" class="timeline-label"></span>
      <span id="timelineMetrics" class="timeline-metrics timeline-metrics--empty"></span>
    </div>
  </div>
</div>
